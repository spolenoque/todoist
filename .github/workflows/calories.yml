name: Calories

on:
  schedule:
    # Every hour from 08:23 to 00:23 UTC. Each run marks the task done once
    # today is over the goal, so the day is covered even though GitHub starts
    # scheduled runs late, lately by up to 7 hours. A run that lands after
    # midnight in Madrid checks the new day and only refreshes the comment.
    # Not on the hour: that's when GitHub is busiest and delays runs most.
    - cron: "23 0,8-23 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: calories

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5

      - name: Run tests
        run: python3 -m unittest

      # The logs of this repository are public, so this prints neither the
      # calories nor whether the task was marked done.
      - name: Load calories, mark "Физически поактивничать" done over 3,500 kcal
        env:
          TODOIST_API_TOKEN: ${{ secrets.TODOIST_API_TOKEN }}
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
          GOOGLE_REFRESH_TOKEN: ${{ secrets.GOOGLE_REFRESH_TOKEN }}
        run: python3 fitbit_calories.py --task 6hWjfQ7h6HXM5hc8 --complete-above 3500
