name: Habit tracker

on:
  schedule:
    # 00:15 UTC is 01:15 CET / 02:15 CEST. It runs after local midnight so
    # anything left undone yesterday is overdue and counts as failed.
    - cron: "15 0 * * *"
  workflow_dispatch:
    inputs:
      dry_run:
        description: Print the comments instead of writing them
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: habit-tracker

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5

      - name: Run tests
        id: tests
        run: python3 -m unittest

      - name: Update habit stats
        env:
          TODOIST_API_TOKEN: ${{ secrets.TODOIST_API_TOKEN }}
        run: python3 habit_tracker.py ${{ inputs.dry_run && '--dry-run' || '' }}

      # Each account runs even if the one before it failed, as long as the
      # tests passed.
      - name: Update habit stats for lu
        if: ${{ !cancelled() && steps.tests.outcome == 'success' }}
        env:
          TODOIST_API_TOKEN_LU: ${{ secrets.TODOIST_API_TOKEN_LU }}
        run: python3 habit_tracker.py --account lu ${{ inputs.dry_run && '--dry-run' || '' }}

      # Yesterday's calories from the Fitbit, into "Физически поактивничать".
      # A dry run would print them and this repository's logs are public, so
      # it skips this step.
      - name: Load calories burned
        if: ${{ !cancelled() && steps.tests.outcome == 'success' && !inputs.dry_run }}
        env:
          TODOIST_API_TOKEN: ${{ secrets.TODOIST_API_TOKEN }}
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
          GOOGLE_REFRESH_TOKEN: ${{ secrets.GOOGLE_REFRESH_TOKEN }}
        run: python3 fitbit_calories.py --task 6hWjfQ7h6HXM5hc8
